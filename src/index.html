<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title> CFS Admin Portal </title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="CSF Administration Portal - Client , Sites, Role and User Management" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Lexend:wght@400;500;600;700&display=swap"
      rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('cfs_theme_mode');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-mode', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-mode', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-800 antialiased dark:bg-[#070c18] dark:text-slate-100">
    <app-root></app-root>
  </body>
</html>
