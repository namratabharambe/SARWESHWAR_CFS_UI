<div class="relative inline-flex shrink-0">
  @if (imageUrl()) {
    <img
      [src]="imageUrl()"
      [alt]="name()"
      class="shadow-xs rounded-full object-cover ring-1 ring-black/5 dark:ring-white/10"
      [class]="sizeClasses()" />
  } @else {
    <div
      class="shadow-xs flex select-none items-center justify-center rounded-full bg-blue-100 font-semibold text-blue-700 ring-1 ring-blue-600/10 dark:bg-blue-950/60 dark:text-blue-300 dark:ring-blue-400/20"
      [class]="sizeClasses()">
      {{ initials() }}
    </div>
  }

  @if (status()) {
    <span
      class="absolute bottom-0 right-0 block rounded-full ring-2"
      [class.w-2]="size() === 'sm'"
      [class.h-2]="size() === 'sm'"
      [class.w-2.5]="size() === 'md'"
      [class.h-2.5]="size() === 'md'"
      [class.w-3]="size() === 'lg'"
      [class.h-3]="size() === 'lg'"
      [class]="statusClasses()"></span>
  }
</div>
