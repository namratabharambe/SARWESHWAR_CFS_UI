<div

    class="w-full max-w-lg rounded-2xl border border-slate-200 bg-white p-10 text-center shadow-xl dark:border-slate-800 dark:bg-[#111a2e]">
    <div class="inline-flex rounded-full bg-amber-50 p-4 dark:bg-amber-950/40">
      <span class="material-icons-outlined text-5xl text-amber-500">construction</span>
    </div>
    <h1 class="mt-4 text-2xl font-bold text-slate-900 dark:text-white">Scheduled Maintenance</h1>

        {{ 'COMMON.REFRESH' | translate }}
      </button>
