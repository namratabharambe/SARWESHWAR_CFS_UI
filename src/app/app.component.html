<router-outlet />

<!-- Global Session Expired / 401 Unauthorized Popup Modal -->
@if (auth.sessionExpired()) {
  <div
    class="session-modal-backdrop fixed inset-0 z-[99999] flex items-center justify-center bg-slate-950/75 p-5 backdrop-blur-sm"
    role="dialog"
    aria-modal="true"
    aria-labelledby="session-modal-title">
    <div
      class="session-modal-card flex w-full max-w-md flex-col items-center gap-5 rounded-2xl border border-slate-200 bg-white p-7 text-center shadow-2xl dark:border-slate-800 dark:bg-[#111928]">
      <div
        class="session-icon-circle flex h-14 w-14 items-center justify-center rounded-2xl bg-amber-50 text-2xl dark:bg-amber-950/50">
        <span class="session-lock-icon">🔒</span>
      </div>

      <div class="session-content-block">
        <h3 id="session-modal-title" class="session-title text-lg font-bold text-slate-900 dark:text-white">
          Session Expired
        </h3>
        <p class="session-desc mt-1 text-xs text-slate-500 dark:text-slate-400">
          Your active login session has timed out or is no longer authorized. Please sign in again to continue managing
          CFS operations.
        </p>
      </div>

      <div
        class="session-user-badge flex items-center gap-3 rounded-xl border border-slate-100 bg-slate-50 p-2.5 dark:border-slate-800 dark:bg-slate-900">
        <span
          class="session-user-avatar flex h-9 w-9 items-center justify-center rounded-lg bg-blue-600 font-bold text-white"
          >{{ auth.userInitials() }}</span
        >
        <div class="session-user-info flex flex-col text-left">
          <strong class="session-user-name text-xs font-bold text-slate-900 dark:text-white">{{
            auth.userName()
          }}</strong>
          <small class="session-user-role text-[11px] font-semibold text-blue-600 dark:text-blue-400">{{
            auth.userRoleDisplay()
          }}</small>
        </div>
      </div>

      <div class="session-modal-actions w-full">
        <button
          type="button"
          class="btn-session-relogin btn-electric flex h-10 w-full items-center justify-center gap-2 rounded-lg text-xs font-semibold shadow-sm transition-all active:scale-95"
          (click)="relogin()"
          autofocus>
          <span>Sign In Again</span>
          <span class="arrow-icon">→</span>
        </button>
      </div>
    </div>
  </div>
}
