<app-page-header
  [breadcrumbs]="breadcrumbs"
  [title]="'ROLES.TITLE' | translate"
  [subtitle]="'ROLES.SUBTITLE' | translate"
  [actionLabel]="'ROLES.NEW_ROLE' | translate"
  actionIcon="add"
  (action)="open()" />

<div class="role-grid">
  @for (x of repo.roles(); track x.id) {
    <article class="role-card">
      <div class="role-icon">
        <span class="material-icons-outlined">verified_user</span>
      </div>
      <div class="role-card-content">
        <div class="role-title">
          <h2>{{ x.name }}</h2>
          <span class="level-badge" [class.level-client]="x.level === 'Client'" [class.level-site]="x.level === 'Site'">
            {{ x.level }}
          </span>
        </div>
        <p>{{ x.description }}</p>
        <button type="button" class="btn-edit-role" (click)="open(x)">{{ 'COMMON.EDIT' | translate }} →</button>
      </div>
    </article>
  }
</div>

@if (editing() !== undefined) {
  <app-modal
    [title]="(editing() ? 'ROLES.MODAL_EDIT_TITLE' : 'ROLES.MODAL_NEW_TITLE') | translate"
    [subtitle]="(editing() ? 'ROLES.MODAL_EDIT_SUBTITLE' : 'ROLES.MODAL_NEW_SUBTITLE') | translate"
    icon="security"
    (closed)="editing.set(undefined)">
    <form class="form-grid" [formGroup]="form" (ngSubmit)="save()">
      <app-form-field
        [label]="'ROLES.FIELD_NAME' | translate"
        name="name"
        [control]="form.controls.name"
        [placeholder]="'ROLES.FIELD_NAME_PLACEHOLDER' | translate" />
      <app-form-field
        [label]="'ROLES.FIELD_SCOPE' | translate"
        name="level"
        type="select"
        [control]="form.controls.level"
        [options]="levelOptions" />
      <app-form-field
        [label]="'ROLES.FIELD_DESCRIPTION' | translate"
        name="description"
        type="textarea"
        [control]="form.controls.description"
        [placeholder]="'ROLES.FIELD_DESCRIPTION_PLACEHOLDER' | translate" />

      <div class="form-actions">
        <app-button variant="secondary" (pressed)="editing.set(undefined)">{{
          'COMMON.CANCEL' | translate
        }}</app-button>
        <app-button type="submit" [appFocusInvalidField]="form" [disabled]="form.invalid">{{
          'ROLES.SAVE_ROLE' | translate
        }}</app-button>
      </div>
    </form>
  </app-modal>
}
