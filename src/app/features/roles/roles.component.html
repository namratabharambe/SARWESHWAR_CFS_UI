<app-page-header
  [breadcrumbs]="breadcrumbs"
  [title]="'ROLES.TITLE' | translate"
  [subtitle]="'ROLES.SUBTITLE' | translate"
  [actionLabel]="'ROLES.NEW_ROLE' | translate"
  actionIcon="add"
  (action)="open()" />

<div class="role-grid grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
  @for (x of repo.roles(); track x.id) {
    <article class="role-card flex items-start gap-3.5 rounded-xl border border-slate-200 bg-white p-5 shadow-sm transition-all hover:shadow-md dark:border-slate-800 dark:bg-[#111a2e]">
      <div class="role-icon flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-blue-50 text-blue-600 dark:bg-blue-950/50 dark:text-blue-400">
        <span class="material-icons-outlined text-xl">verified_user</span>
      </div>
      <div class="role-card-content flex flex-1 flex-col overflow-hidden">
        <div class="role-title flex items-center justify-between gap-2">
          <h2 class="truncate text-sm font-bold text-slate-900 dark:text-white">{{ x.name }}</h2>
          <span
            class="level-badge inline-flex shrink-0 rounded-md border px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider"
            [class.bg-blue-50]="x.level === 'Client'"
            [class.text-blue-700]="x.level === 'Client'"
            [class.border-blue-200]="x.level === 'Client'"
            [class.dark:bg-blue-950/40]="x.level === 'Client'"
            [class.dark:text-blue-300]="x.level === 'Client'"
            [class.dark:border-blue-800/40]="x.level === 'Client'"
            [class.bg-emerald-50]="x.level === 'Site'"
            [class.text-emerald-700]="x.level === 'Site'"
            [class.border-emerald-200]="x.level === 'Site'"
            [class.dark:bg-emerald-950/40]="x.level === 'Site'"
            [class.dark:text-emerald-300]="x.level === 'Site'"
            [class.dark:border-emerald-800/40]="x.level === 'Site'">
            {{ x.level }}
          </span>
        </div>
        <p class="mt-1 text-xs text-slate-500 line-clamp-2 dark:text-slate-400">{{ x.description }}</p>
        <button type="button" class="btn-edit-role mt-3 self-start text-xs font-semibold text-blue-600 hover:text-blue-700 dark:text-blue-400 dark:hover:text-blue-300" (click)="open(x)">{{ 'COMMON.EDIT' | translate }} →</button>
      </div>
    </article>
  }
</div>

@if (editing() !== undefined) {
  <app-modal
    [title]="editing() ? ('ROLES.MODAL_EDIT_TITLE' | translate) : ('ROLES.MODAL_NEW_TITLE' | translate)"
    [subtitle]="editing() ? ('ROLES.MODAL_EDIT_SUBTITLE' | translate) : ('ROLES.MODAL_NEW_SUBTITLE' | translate)"
    icon="security"
    (closed)="editing.set(undefined)">
    <form class="form-grid flex flex-col gap-3.5" [formGroup]="form" (ngSubmit)="save()">
      <app-form-field [label]="'ROLES.FIELD_NAME' | translate" name="name" [control]="form.controls.name" [placeholder]="'ROLES.FIELD_NAME_PLACEHOLDER' | translate" />
      <app-form-field
        [label]="'ROLES.FIELD_SCOPE' | translate"
        name="level"
        type="select"
        [control]="form.controls.level"
        [options]="levelOptions" />
      <app-form-field
        [label]="'ROLES.FIELD_DESCRIPTION' | translate"
        name="description"
        type="textarea"
        [control]="form.controls.description"
        [placeholder]="'ROLES.FIELD_DESC_PLACEHOLDER' | translate" />

      <div class="form-actions mt-4 flex items-center justify-end gap-3 border-t border-slate-100 pt-4 dark:border-slate-800">
        <app-button variant="secondary" (pressed)="editing.set(undefined)">{{ 'COMMON.CANCEL' | translate }}</app-button>
        <app-button type="submit" [appFocusInvalidField]="form" [disabled]="form.invalid">{{ 'COMMON.SAVE' | translate }}</app-button>
      </div>
    </form>
  </app-modal>
}
