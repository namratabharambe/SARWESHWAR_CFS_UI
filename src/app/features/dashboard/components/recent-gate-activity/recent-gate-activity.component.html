<div
  class="dashboard-card recent-gate-card flex h-full flex-col justify-between rounded-[12px] border border-[rgba(82,94,167,0.12)] bg-white p-3.5 shadow-xs dark:border-[rgba(148,163,184,0.14)] dark:bg-[#111a2e] relative overflow-hidden">
  <!-- Card Header -->
  <div class="mb-2.5 flex items-center justify-between border-b border-slate-100 pb-2 dark:border-slate-800/80">
    <div class="flex items-center gap-2 min-w-0">
      <div class="flex h-7 w-7 items-center justify-center rounded-lg bg-blue-50 text-blue-600 dark:bg-blue-950/60 dark:text-blue-400 shrink-0 shadow-2xs">
        <!-- Activity Pulse SVG Icon -->
        <svg class="h-4 w-4 fill-none stroke-current" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
      </div>
      <div class="flex items-center gap-1.5 min-w-0">
        <h3 class="text-xs sm:text-sm font-bold text-[#0f2851] dark:text-white truncate">
          Recent Gate Activity
        </h3>
        <span class="inline-flex items-center rounded-full bg-blue-50 px-1.5 py-0.5 text-[9px] font-bold text-blue-700 dark:bg-blue-950/60 dark:text-blue-300 shrink-0">
          Live
        </span>
      </div>
    </div>
    <a
      routerLink="/gate-events"
      class="view-all-link inline-flex items-center gap-1 text-[11px] font-semibold text-blue-600 transition-colors hover:text-blue-700 dark:text-blue-400 dark:hover:text-blue-300 shrink-0">
      <span>View All</span>
      <span class="text-xs">→</span>
    </a>
  </div>

  <!-- Streamlined Activity List -->
  <div class="table-scroll-viewport flex-1 min-h-0 overflow-y-auto rounded-lg border border-slate-100 dark:border-slate-800/60 bg-slate-50/40 dark:bg-slate-900/30">
    <div class="divide-y divide-slate-100 dark:divide-slate-800/60">
      @for (item of latest(); track item.id) {
        <div
          class="activity-single-line flex items-center justify-between gap-2.5 px-3 py-2 hover:bg-blue-50/60 dark:hover:bg-slate-800/60 transition-colors text-xs cursor-pointer select-none"
          (click)="onActivityClick(item)"
          title="Click to view gate event details for {{ item.containerNo }}">
          <!-- 1. Image Thumbnail + Container Number & Timestamp -->
          <div class="flex items-center gap-2.5 min-w-0 flex-1">
            <div
              class="relative h-9 w-11 shrink-0 overflow-hidden rounded-md border border-slate-200 bg-slate-100 dark:border-slate-700 dark:bg-slate-800 shadow-2xs">
              <img
                [src]="item.imageUrl || 'assets/images/throughput-truck.png'"
                [alt]="item.containerNo"
                class="h-full w-full object-cover" />
            </div>
            <div class="flex flex-col min-w-0 justify-center">
              <span class="font-mono text-xs sm:text-[13px] font-black tracking-wide text-[#0f2851] dark:text-cyan-300 whitespace-nowrap">
                {{ item.containerNo }}
              </span>
              <div class="flex items-center gap-1.5 text-[10.5px] font-semibold text-slate-500 dark:text-slate-400 whitespace-nowrap leading-tight mt-0.5">
                <span>{{ item.time }}</span>
              </div>
            </div>
          </div>

          <!-- 2. Direction Badge -->
          <div class="shrink-0 flex items-center">
            <span
              class="inline-flex items-center gap-1 rounded-md px-2 py-0.5 text-[10px] font-black uppercase tracking-wider shadow-2xs whitespace-nowrap"
              [class]="item.type === 'IN' ? 'bg-emerald-100/80 text-emerald-800 dark:bg-emerald-950/80 dark:text-emerald-300 border border-emerald-200/60 dark:border-emerald-800/60' : 'bg-orange-100/80 text-orange-800 dark:bg-orange-950/80 dark:text-orange-300 border border-orange-200/60 dark:border-orange-800/60'">
              <span>{{ item.type === 'IN' ? '↓' : '↑' }}</span>
              <span>{{ item.type === 'IN' ? 'GATE IN' : 'GATE OUT' }}</span>
            </span>
          </div>
        </div>
      } @empty {
        <div class="py-8 text-center text-xs font-semibold text-slate-400">No recent gate activity recorded.</div>
      }
    </div>
  </div>
</div>
