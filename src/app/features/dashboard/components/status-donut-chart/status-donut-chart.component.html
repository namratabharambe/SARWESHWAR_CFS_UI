<div
  class="glass-card flex h-full flex-col justify-between rounded-2xl p-5">
  <!-- Header -->
  <div class="mb-3 flex items-center justify-between">
    <h3 class="text-base font-bold text-gray-900 dark:text-white">{{ chartData().title }}</h3>
    @if (chartData().viewAllRoute) {
      <a
        [routerLink]="chartData().viewAllRoute"
        class="inline-flex items-center text-xs font-semibold text-blue-600 transition-colors hover:text-blue-700 hover:underline dark:text-blue-400">
        View All →
      </a>
    }
  </div>

  <!-- Chart & Legend Container -->
  <div class="flex flex-1 items-center justify-between gap-4">
    <!-- SVG Donut Chart with Center Metric -->
    <div class="relative flex h-36 w-36 shrink-0 items-center justify-center">
      <svg class="h-full w-full -rotate-90 transform" viewBox="0 0 100 100">
        <!-- Background Track -->
        <circle
          cx="50"
          cy="50"
          [attr.r]="radius"
          stroke-width="11"
          class="fill-transparent stroke-gray-100 dark:stroke-gray-800" />

        <!-- Segments -->
        @for (seg of calculatedSegments(); track seg.id) {
          <circle
            cx="50"
            cy="50"
            [attr.r]="radius"
            [attr.stroke]="seg.color"
            stroke-width="11"
            fill="transparent"
            [attr.stroke-dasharray]="seg.strokeDasharray"
            [attr.stroke-dashoffset]="seg.strokeDashoffset"
            class="transition-all duration-500 hover:opacity-85" />
        }
      </svg>

      <!-- Center Text -->
      <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
        <span class="text-3xl font-black tracking-tight text-slate-900 dark:text-white">
          {{ chartData().totalCount }}
        </span>
        <span class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">
          {{ chartData().totalLabel }}
        </span>
      </div>
    </div>

    <!-- Legend Breakdown List -->
    <div class="flex flex-1 flex-col justify-center gap-2.5 text-xs">
      @for (seg of chartData().segments; track seg.id) {
        <div class="flex items-center justify-between gap-2">
          <div class="flex items-center gap-2.5 overflow-hidden">
            <span
              class="h-3 w-3 shrink-0 rounded-full shadow-sm"
              [style.background-color]="seg.color"></span>
            <span class="truncate font-semibold text-slate-700 dark:text-slate-200 text-xs">{{ seg.label }}</span>
          </div>

          <div class="flex items-center gap-1.5 font-bold text-slate-900 dark:text-white text-xs">
            <span>{{ seg.count }}</span>
            <span class="text-xs font-medium text-slate-500 dark:text-slate-400">({{ seg.percentage }}%)</span>
          </div>
        </div>
      }
    </div>
  </div>
</div>
