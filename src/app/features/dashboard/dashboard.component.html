<div class="dashboard-page relative flex flex-col gap-3.5 min-w-0">
  <!-- Top Ambient Sheen Laser Line on Dashboard Open -->
  <div class="dashboard-sheen-line" aria-hidden="true"></div>

  <!-- Top Hero Banner: Welcome CFS + Weather Widget + Today's Throughput -->
  <section
    class="dashboard-section-hero grid grid-cols-1 gap-3.5 md:grid-cols-12 lg:grid-cols-12 items-stretch min-w-0">
    <!-- 1. Welcome CFS Operations Control Tower Card -->
    <div
      class="welcome-banner-card md:col-span-6 lg:col-span-6 flex items-center justify-between rounded-[12px] border border-[rgba(82,94,167,0.12)] bg-white p-4 shadow-xs relative overflow-hidden dark:border-[rgba(148,163,184,0.14)] dark:bg-[#111a2e] min-w-0">
      <!-- Background Terminal Scene -->
      <div class="banner-bg-media absolute inset-0 z-0 overflow-hidden pointer-events-none">
        <img src="assets/images/welcome-banner-bg.png" alt="CFS Operations"
          class="h-full w-full object-cover object-right opacity-90" />
        <div
          class="absolute inset-0 bg-gradient-to-r from-blue-50/95 via-sky-50/85 to-transparent dark:from-[#0d1527]/95 dark:via-[#0d1527]/80 dark:to-transparent">
        </div>
      </div>

      <!-- Text Content -->
      <div class="relative z-10 flex flex-col min-w-0 max-w-[75%]">
        <span class="text-xs font-bold text-blue-700 dark:text-blue-400 tracking-wide leading-none">Welcome to</span>
        <div class="flex items-center gap-2 flex-wrap my-1 min-w-0">
          <h1
            class="text-base sm:text-lg xl:text-xl font-black tracking-tight text-[#0f2851] dark:text-white leading-tight truncate">
            CFS Operations Control Tower
          </h1>
          <span
            class="inline-flex items-center gap-1.5 rounded-full border border-emerald-200 bg-emerald-50 px-2.5 py-0.5 text-[11px] font-bold text-emerald-700 dark:border-emerald-800/60 dark:bg-emerald-950/60 dark:text-emerald-300 shadow-2xs shrink-0">
            <span class="beacon-dot-live"></span>
            Terminal Live
          </span>
        </div>
        <p class="text-xs font-medium text-slate-600 dark:text-slate-300 truncate">
          Real-time visibility. Smarter operations. Seamless logistics.
        </p>
      </div>
    </div>

    <!-- 2. Weather Widget Card -->
    <div
      class="weather-widget-card md:col-span-3 lg:col-span-3 flex items-center gap-3 rounded-[12px] px-3.5 py-3 bg-white dark:bg-[#111a2e] border border-[rgba(82,94,167,0.12)] dark:border-[rgba(148,163,184,0.14)] shadow-xs min-w-0">
      <div class="relative flex h-10 w-10 shrink-0 items-center justify-center">
        <span class="material-icons text-amber-400 text-3xl select-none">wb_sunny</span>
        <span
          class="material-icons text-sky-400 text-xl absolute -bottom-1 -right-1 drop-shadow-sm select-none">cloud</span>
      </div>
      <div class="flex flex-col min-w-0">
        <span class="text-lg font-black tracking-tight text-[#0f2851] dark:text-white leading-none">32°C</span>
        <span class="text-xs font-semibold text-slate-600 dark:text-slate-300 leading-tight mt-1 truncate">Partly
          Cloudy</span>
        <span class="text-[11px] font-medium text-slate-400 dark:text-slate-500 leading-tight truncate">Nhava Sheva,
          MH</span>
      </div>
    </div>

    <!-- 3. Today's Throughput Card -->
    <div
      class="throughput-widget-card md:col-span-3 lg:col-span-3 flex items-center gap-3 rounded-[12px] px-3.5 py-3 bg-white dark:bg-[#111a2e] border border-[rgba(82,94,167,0.12)] dark:border-[rgba(148,163,184,0.14)] shadow-xs relative overflow-hidden min-w-0">
      <img src="assets/images/throughput-truck.png" alt="Throughput Truck"
        class="h-12 w-20 rounded-lg object-cover shrink-0 shadow-xs border border-slate-100 dark:border-slate-800" />
      <div class="flex flex-col z-10 min-w-0 flex-1">
        <span class="text-xs font-bold text-[#0f2851] dark:text-slate-200 leading-tight truncate">Today's
          Throughput</span>
        <span class="text-xl font-black text-[#0f2851] dark:text-white leading-tight my-0.5 truncate">142</span>
        <span class="text-[11px] font-medium text-slate-500 dark:text-slate-400 leading-none truncate">Containers
          Handled</span>
        <div class="flex items-center gap-1 text-xs font-bold text-emerald-600 dark:text-emerald-400 mt-1 truncate">
          <span>↑ 12%</span>
          <span class="text-[11px] font-medium text-slate-500 dark:text-slate-400">vs. last week</span>
        </div>
      </div>
      <div class="pointer-events-none absolute -bottom-1 -right-1 h-12 w-20 overflow-hidden opacity-30">
        <svg class="h-full w-full" viewBox="0 0 96 40" preserveAspectRatio="none">
          <defs>
            <linearGradient id="waveGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
              <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
            </linearGradient>
          </defs>
          <path d="M0,32 Q36,12 68,26 T96,6 L96,40 L0,40 Z" fill="url(#waveGrad)" />
          <path d="M0,32 Q36,12 68,26 T96,6" fill="none" stroke="#38bdf8" stroke-width="2" />
        </svg>
      </div>
    </div>
  </section>

  <!-- Top Row: 5 KPI Metric Cards -->
  <section class="dashboard-section-kpi grid grid-cols-1 gap-3.5 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 min-w-0">
    @for (metric of dashboardService.kpiMetrics(); track metric.id) {
    <app-kpi-metric-card [metric]="metric" class="dashboard-kpi-card min-w-0" />
    }
  </section>

  <!-- Main Operational Grid: 3 Clean Columns with Uniform 14px Gaps -->
  <section class="dashboard-section-ops-grid grid grid-cols-1 lg:grid-cols-12 gap-3.5 items-stretch min-w-0">
    <!-- Left Column: Yard Overview (6 columns) -->
    <div class="lg:col-span-6 flex flex-col min-w-0">
      <app-yard-overview [yardRows]="dashboardService.yardRows()" [metrics]="dashboardService.yardMetrics()"
        class="h-full flex flex-col min-w-0" />
    </div>

    <!-- Middle Column: Recent Gate Activity + Gate Operations (Live) (3 columns) -->
    <div class="lg:col-span-3 flex flex-col gap-3.5 min-w-0 justify-between">
      <app-recent-gate-activity [activities]="dashboardService.filteredGateActivities()"
        class="flex-1 flex flex-col min-w-0" />

      <app-gate-operations-live [tabs]="dashboardService.gateTabs()" [stages]="dashboardService.gateLiveStages()"
        [nextTruck]="dashboardService.nextTruckInfo()" [selectedGateId]="dashboardService.selectedGateId()"
        (gateTabChange)="dashboardService.selectGateTab($event)" class="flex-1 flex flex-col min-w-0" />
    </div>

    <!-- Right Column: Yard Capacity & Utilization + Exceptions & Alerts (3 columns) -->
    <div class="lg:col-span-3 flex flex-col gap-3.5 min-w-0 justify-between">
      <app-yard-capacity-utilization [yardRows]="dashboardService.yardRows()" [metrics]="dashboardService.yardMetrics()"
        class="flex-1 flex flex-col min-w-0" />

      <app-exception-alerts [alerts]="dashboardService.exceptionAlerts()" class="flex-1 flex flex-col min-w-0" />
    </div>
  </section>
</div>
