<span
  class="inline-flex items-center gap-1.5 rounded-full border px-2.5 py-0.5 text-xs font-semibold tracking-wide transition-all duration-150"
  [class.bg-green-100]="statusCategory() === 'success'"
  [class.text-green-800]="statusCategory() === 'success'"
  [class.border-green-200]="statusCategory() === 'success'"
  [class.dark:bg-green-950/40]="statusCategory() === 'success'"
  [class.dark:text-green-300]="statusCategory() === 'success'"
  [class.dark:border-green-800/40]="statusCategory() === 'success'"
  [class.bg-amber-100]="statusCategory() === 'pending'"
  [class.text-amber-800]="statusCategory() === 'pending'"
  [class.border-amber-200]="statusCategory() === 'pending'"
  [class.dark:bg-amber-950/40]="statusCategory() === 'pending'"
  [class.dark:text-amber-300]="statusCategory() === 'pending'"
  [class.dark:border-amber-800/40]="statusCategory() === 'pending'"
  [class.bg-red-100]="statusCategory() === 'error'"
  [class.text-red-800]="statusCategory() === 'error'"
  [class.border-red-200]="statusCategory() === 'error'"
  [class.dark:bg-red-950/40]="statusCategory() === 'error'"
  [class.dark:text-red-300]="statusCategory() === 'error'"
  [class.dark:border-red-800/40]="statusCategory() === 'error'"
  [class.bg-blue-100]="statusCategory() === 'processing'"
  [class.text-blue-800]="statusCategory() === 'processing'"
  [class.border-blue-200]="statusCategory() === 'processing'"
  [class.dark:bg-blue-950/40]="statusCategory() === 'processing'"
  [class.dark:text-blue-300]="statusCategory() === 'processing'"
  [class.dark:border-blue-800/40]="statusCategory() === 'processing'"
  [class.bg-slate-100]="statusCategory() === 'inactive'"
  [class.text-slate-600]="statusCategory() === 'inactive'"
  [class.border-slate-200]="statusCategory() === 'inactive'"
  [class.dark:bg-slate-800/50]="statusCategory() === 'inactive'"
  [class.dark:text-slate-400]="statusCategory() === 'inactive'"
  [class.dark:border-slate-700/50]="statusCategory() === 'inactive'">
  <span
    class="h-1.5 w-1.5 rounded-full"
    [class.bg-green-600]="statusCategory() === 'success'"
    [class.bg-amber-500]="statusCategory() === 'pending'"
    [class.bg-red-500]="statusCategory() === 'error'"
    [class.bg-blue-600]="statusCategory() === 'processing'"
    [class.bg-slate-400]="statusCategory() === 'inactive'"></span>
  <span>{{ statusText() }}</span>
</span>
