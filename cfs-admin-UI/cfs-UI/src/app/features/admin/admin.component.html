<div class="admin-management-page flex flex-col gap-5">
  <!-- Page Header -->
  <app-page-header title="Admin Management" subtitle="Manage sites, users, roles and access permissions" />

  <!-- Management Cards: 3 Options in One Clean Row on Desktop -->
  <section class="grid grid-cols-1 gap-5 md:grid-cols-3" aria-label="Admin Modules">
    @for (card of adminCards; track card.id) {
    <a [routerLink]="card.route"
      class="admin-module-card group relative flex flex-col justify-between rounded-[14px] border border-slate-200/90 bg-white p-5 shadow-xs hover:-translate-y-0.5 hover:shadow-md dark:border-slate-800 dark:bg-[#111a2e] cursor-pointer"
      [class.accent-blue]="card.accentColor === 'blue'"
      [class.accent-teal]="card.accentColor === 'teal'"
      [class.accent-purple]="card.accentColor === 'purple'">
      <!-- Top Section: Icon + Title & Description -->
      <div>
        <div class="flex items-center gap-3.5 mb-3.5">
          <div class="module-icon-wrap shrink-0">
            <span class="material-icons-outlined">{{ card.icon }}</span>
          </div>
          <h2 class="module-title text-base font-bold transition-colors">
            {{ card.title }}
          </h2>
        </div>

        <p class="text-xs md:text-sm text-slate-500 dark:text-slate-400 leading-relaxed">
          {{ card.description }}
        </p>
      </div>

      <!-- Bottom Action: Open -> -->
      <div class="module-action-link mt-5 pt-3.5 border-t border-slate-100 flex items-center justify-between text-xs font-bold dark:border-slate-800/80">
        <span>Open</span>
        <span class="material-icons-outlined text-sm transition-transform duration-200 group-hover:translate-x-1">
          arrow_forward
        </span>
      </div>
    </a>
    }
  </section>
</div>
