@if (isOpen()) {
  <div
    class="modal-backdrop fixed inset-0 z-50 flex items-center justify-center bg-slate-950/65 p-4 backdrop-blur-sm animate-fadeIn"
    (click)="onBackdropClick($event)">
    <div
      class="modal-container relative flex max-h-[92vh] w-full max-w-3xl flex-col rounded-3xl border border-gray-200 bg-white shadow-2xl dark:border-gray-800 dark:bg-gray-850"
      (click)="$event.stopPropagation()">
      
      <!-- Modal Header -->
      <div class="flex items-center justify-between border-b border-gray-100 px-6 py-5 dark:border-gray-800">
        <div class="flex items-center gap-3">
          <div class="flex h-10 w-10 items-center justify-center rounded-2xl bg-blue-50 text-blue-600 dark:bg-blue-950/70 dark:text-blue-400">
            <span class="material-icons-outlined text-2xl">add_task</span>
          </div>
          <div>
            <h2 class="text-lg font-bold tracking-tight text-gray-900 dark:text-white">Create New Task</h2>
            <p class="text-xs text-gray-500 dark:text-gray-400">Assign container routing and dispatch equipment</p>
          </div>
        </div>

        <button
          type="button"
          (click)="close.emit()"
          class="flex h-9 w-9 items-center justify-center rounded-xl bg-gray-100 text-gray-400 transition-colors hover:bg-gray-200 hover:text-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-gray-200">
          <span class="material-icons-outlined text-lg">close</span>
        </button>
      </div>

      <!-- Modal Body (Scrollable) -->
      <div class="flex-1 overflow-y-auto px-6 py-5 space-y-6">
        <!-- Error Banner if validation fails -->
        @if (errorMessage()) {
          <div class="flex items-center gap-2 rounded-xl border border-rose-200 bg-rose-50 px-4 py-3 text-xs font-semibold text-rose-700 dark:border-rose-900 dark:bg-rose-950/50 dark:text-rose-300">
            <span class="material-icons-outlined text-base">error_outline</span>
            <span>{{ errorMessage() }}</span>
          </div>
        }

        <!-- 1. Task Type Selector Strip -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-2.5">
            1. Select Task Type
          </label>
          <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-2">
            @for (t of taskTypes; track t.type) {
              <button
                type="button"
                (click)="selectTaskType(t.type)"
                class="flex flex-col items-center justify-center gap-1.5 rounded-2xl border p-3 text-xs font-semibold transition-all duration-150"
                [ngClass]="{
                  'border-blue-600 bg-blue-50/80 text-blue-700 ring-2 ring-blue-500/20 shadow-sm dark:border-blue-500 dark:bg-blue-950/60 dark:text-blue-300': selectedTaskType() === t.type,
                  'border-gray-200 bg-white text-gray-700 hover:border-gray-300 hover:bg-gray-50 dark:border-gray-800 dark:bg-gray-800/40 dark:text-gray-300 dark:hover:bg-gray-800': selectedTaskType() !== t.type
                }">
                <span class="material-icons-outlined text-xl" [class.text-blue-600]="selectedTaskType() === t.type" [class.dark:text-blue-400]="selectedTaskType() === t.type">
                  {{ t.icon }}
                </span>
                <span class="text-center leading-tight">{{ t.label }}</span>
              </button>
            }
          </div>
        </div>

        <!-- 2. Container & Cargo Information -->
        <div class="rounded-2xl border border-gray-100 bg-gray-50/40 p-4 dark:border-gray-800 dark:bg-gray-800/20 space-y-4">
          <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400">
            2. Container & Booking Details
          </label>

          <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3.5">
            <!-- Container Number -->
            <div>
              <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1">
                Container No. <span class="text-rose-500">*</span>
              </label>
              <input
                type="text"
                [ngModel]="containerNo()"
                (ngModelChange)="containerNo.set($event)"
                placeholder="e.g. MSCU 556123 4"
                class="w-full rounded-xl border border-gray-200 bg-white px-3 py-2 text-xs font-mono font-bold uppercase text-gray-900 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20 dark:border-gray-700 dark:bg-gray-800 dark:text-white" />
            </div>

            <!-- Size / Type -->
            <div>
              <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1">
                Container Size / Type
              </label>
              <select
                [ngModel]="sizeType()"
                (ngModelChange)="sizeType.set($event)"
                class="w-full rounded-xl border border-gray-200 bg-white px-3 py-2 text-xs font-medium text-gray-900 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20 dark:border-gray-700 dark:bg-gray-800 dark:text-white">
                @for (opt of sizeOptions; track opt.value) {
                  <option [value]="opt.value">{{ opt.label }}</option>
                }
              </select>
            </div>

            <!-- Booking No. -->
            <div>
              <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1">
                Booking / BL Reference
              </label>
              <input
                type="text"
                [ngModel]="bookingNo()"
                (ngModelChange)="bookingNo.set($event)"
                placeholder="e.g. BKGS2051709"
                class="w-full rounded-xl border border-gray-200 bg-white px-3 py-2 text-xs font-mono text-gray-900 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20 dark:border-gray-700 dark:bg-gray-800 dark:text-white" />
            </div>

            <!-- Cargo Type -->
            <div>
              <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1">
                Cargo Description
              </label>
              <input
                type="text"
                [ngModel]="cargoType()"
                (ngModelChange)="cargoType.set($event)"
                placeholder="e.g. Industrial Machinery"
                class="w-full rounded-xl border border-gray-200 bg-white px-3 py-2 text-xs text-gray-900 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20 dark:border-gray-700 dark:bg-gray-800 dark:text-white" />
            </div>

            <!-- Gross Weight -->
            <div>
              <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1">
                Gross Weight
              </label>
              <input
                type="text"
                [ngModel]="grossWeight()"
                (ngModelChange)="grossWeight.set($event)"
                placeholder="e.g. 24,500 KG"
                class="w-full rounded-xl border border-gray-200 bg-white px-3 py-2 text-xs text-gray-900 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20 dark:border-gray-700 dark:bg-gray-800 dark:text-white" />
            </div>

            <!-- Seal Number -->
            <div>
              <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1">
                Customs / Line Seal
              </label>
              <input
                type="text"
                [ngModel]="sealNo()"
                (ngModelChange)="sealNo.set($event)"
                placeholder="e.g. ML-IN-982341"
                class="w-full rounded-xl border border-gray-200 bg-white px-3 py-2 text-xs font-mono text-gray-900 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20 dark:border-gray-700 dark:bg-gray-800 dark:text-white" />
            </div>
          </div>
        </div>

        <!-- 3. Routing & Location Assignment -->
        <div class="rounded-2xl border border-gray-100 bg-gray-50/40 p-4 dark:border-gray-800 dark:bg-gray-800/20 space-y-4">
          <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400">
            3. Routing & Location Assignment
          </label>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <!-- From Location -->
            <div>
              <label class="flex items-center gap-1 text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1">
                <span class="h-2 w-2 rounded-full bg-blue-500"></span>
                <span>From Location (Origin) <span class="text-rose-500">*</span></span>
              </label>
              <select
                [ngModel]="fromLocation()"
                (ngModelChange)="fromLocation.set($event)"
                class="w-full rounded-xl border border-gray-200 bg-white px-3 py-2 text-xs font-semibold text-gray-900 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20 dark:border-gray-700 dark:bg-gray-800 dark:text-white">
                @for (loc of locationOptions; track loc.value) {
                  <option [value]="loc.value">{{ loc.label }}</option>
                }
              </select>
            </div>

            <!-- To Location -->
            <div>
              <label class="flex items-center gap-1 text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1">
                <span class="h-2 w-2 rounded-full bg-emerald-500"></span>
                <span>To Location (Destination) <span class="text-rose-500">*</span></span>
              </label>
              <select
                [ngModel]="toLocation()"
                (ngModelChange)="toLocation.set($event)"
                class="w-full rounded-xl border border-gray-200 bg-white px-3 py-2 text-xs font-semibold text-gray-900 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20 dark:border-gray-700 dark:bg-gray-800 dark:text-white">
                @for (loc of locationOptions; track loc.value) {
                  <option [value]="loc.value">{{ loc.label }}</option>
                }
              </select>
            </div>
          </div>
        </div>

        <!-- 4. Equipment & Operator Dispatch -->
        <div class="rounded-2xl border border-gray-100 bg-gray-50/40 p-4 dark:border-gray-800 dark:bg-gray-800/20 space-y-4">
          <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400">
            4. Equipment, Operator & SLA Priority
          </label>

          <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3.5">
            <!-- Equipment -->
            <div>
              <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1">
                Equipment
              </label>
              <select
                [ngModel]="equipment()"
                (ngModelChange)="equipment.set($event)"
                class="w-full rounded-xl border border-gray-200 bg-white px-3 py-2 text-xs font-medium text-gray-900 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20 dark:border-gray-700 dark:bg-gray-800 dark:text-white">
                @for (eq of equipmentOptions; track eq.value) {
                  <option [value]="eq.value">{{ eq.label }}</option>
                }
              </select>
            </div>

            <!-- Operator -->
            <div>
              <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1">
                Assign Operator
              </label>
              <select
                [ngModel]="operator()"
                (ngModelChange)="operator.set($event)"
                class="w-full rounded-xl border border-gray-200 bg-white px-3 py-2 text-xs font-medium text-gray-900 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20 dark:border-gray-700 dark:bg-gray-800 dark:text-white">
                @for (op of operatorOptions; track op.value) {
                  <option [value]="op.value">{{ op.label }}</option>
                }
              </select>
            </div>

            <!-- Priority -->
            <div>
              <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1">
                Priority
              </label>
              <select
                [ngModel]="priority()"
                (ngModelChange)="priority.set($event)"
                class="w-full rounded-xl border border-gray-200 bg-white px-3 py-2 text-xs font-semibold text-gray-900 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20 dark:border-gray-700 dark:bg-gray-800 dark:text-white">
                <option value="High">🔴 High Priority</option>
                <option value="Medium">🟠 Medium Priority</option>
                <option value="Low">🟢 Low Priority</option>
                <option value="Critical">⚡ Critical / Expedited</option>
              </select>
            </div>

            <!-- Target SLA -->
            <div>
              <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1">
                Target SLA Time
              </label>
              <select
                [ngModel]="slaMinutes()"
                (ngModelChange)="slaMinutes.set($event)"
                class="w-full rounded-xl border border-gray-200 bg-white px-3 py-2 text-xs font-medium text-gray-900 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20 dark:border-gray-700 dark:bg-gray-800 dark:text-white">
                <option [value]="15">15 Minutes (Urgent)</option>
                <option [value]="30">30 Minutes</option>
                <option [value]="45">45 Minutes (Standard)</option>
                <option [value]="60">60 Minutes</option>
                <option [value]="90">90 Minutes</option>
              </select>
            </div>
          </div>

          <!-- Hazardous Material & Operational Notes -->
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3.5 pt-2">
            <!-- Hazardous Toggle -->
            <div class="sm:col-span-1 flex items-center pt-4">
              <label class="relative flex cursor-pointer items-center gap-2 text-xs font-semibold text-gray-700 dark:text-gray-300">
                <input
                  type="checkbox"
                  [ngModel]="isHazardous()"
                  (ngModelChange)="isHazardous.set($event)"
                  class="h-4 w-4 rounded border-gray-300 text-rose-600 focus:ring-rose-500 dark:border-gray-600 dark:bg-gray-800" />
                <span>⚠️ Hazardous / Dangerous Goods (DG)</span>
              </label>
            </div>

            <!-- Operational Notes -->
            <div class="sm:col-span-2">
              <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1">
                Dispatcher Notes & Instructions
              </label>
              <input
                type="text"
                [ngModel]="notes()"
                (ngModelChange)="notes.set($event)"
                placeholder="e.g. Priority offload at Block C for customs verification."
                class="w-full rounded-xl border border-gray-200 bg-white px-3 py-2 text-xs text-gray-900 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20 dark:border-gray-700 dark:bg-gray-800 dark:text-white" />
            </div>
          </div>
        </div>
      </div>

      <!-- Modal Footer -->
      <div class="flex items-center justify-between border-t border-gray-100 px-6 py-4 dark:border-gray-800">
        <button
          type="button"
          (click)="resetForm()"
          class="rounded-xl px-4 py-2 text-xs font-semibold text-gray-500 hover:bg-gray-100 hover:text-gray-700 dark:text-gray-400 dark:hover:bg-gray-800 dark:hover:text-gray-200">
          Reset Form
        </button>

        <div class="flex items-center gap-2.5">
          <button
            type="button"
            (click)="close.emit()"
            class="rounded-xl border border-gray-200 px-4 py-2.5 text-xs font-semibold text-gray-700 hover:bg-gray-50 dark:border-gray-700 dark:text-gray-300 dark:hover:bg-gray-800">
            Cancel
          </button>
          <button
            type="button"
            (click)="submitTask()"
            class="flex items-center gap-1.5 rounded-xl bg-blue-600 px-5 py-2.5 text-xs font-semibold text-white shadow-md shadow-blue-500/20 transition-all hover:bg-blue-700 active:scale-95">
            <span class="material-icons-outlined text-sm">send</span>
            <span>Create & Dispatch Task</span>
          </button>
        </div>
      </div>
    </div>
  </div>
}
