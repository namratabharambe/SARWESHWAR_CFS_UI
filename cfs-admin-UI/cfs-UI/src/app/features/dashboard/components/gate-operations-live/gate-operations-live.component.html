<div
  class="dashboard-card gate-operations-card shadow-xs relative flex h-full flex-col justify-between overflow-hidden rounded-[12px] bg-white p-4 dark:bg-[#111a2e]">
  <!-- 1. Card Header with horizontal divider line below -->
  <div class="mb-3 flex items-center justify-between border-b border-slate-100 pb-2.5 dark:border-slate-800/80">
    <div class="flex min-w-0 items-center gap-2.5">
      <!-- Blue Double-Door / Gate Icon matching reference -->
      <svg
        class="h-6 w-6 shrink-0 text-blue-600 dark:text-blue-400"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.3"
        stroke-linecap="round"
        stroke-linejoin="round">
        <rect x="3" y="4" width="8" height="17" rx="2" />
        <path d="M11 7h6a2 2 0 0 1 2 2v12" />
        <line x1="1.5" y1="21" x2="22.5" y2="21" />
        <circle cx="7" cy="12.5" r="1" fill="currentColor" stroke="none" />
      </svg>

      <h3 class="truncate text-[15px] font-bold text-[#0f2851] dark:text-white">Gate Operations (Live)</h3>

      <span
        class="inline-flex shrink-0 items-center gap-1.5 rounded-full border border-emerald-300/80 bg-emerald-50 px-2.5 py-0.5 text-xs font-semibold text-emerald-600 dark:border-emerald-800/60 dark:bg-emerald-950/60 dark:text-emerald-400">
        <span class="h-2 w-2 rounded-full bg-emerald-500"></span>
        Live
      </span>
    </div>

    <!-- View All Link (preserved from current UI per user requirement) -->
    <a
      routerLink="/gate-events"
      class="view-all-link group inline-flex shrink-0 items-center gap-1 text-xs font-semibold text-blue-600 transition-colors hover:text-blue-700 dark:text-blue-400 dark:hover:text-blue-300">
      <span>View All</span>
      <span class="text-xs transition-transform duration-200 group-hover:translate-x-0.5">→</span>
    </a>
  </div>

  <!-- 2. Dual Operation Mode Tabs (Gate In vs Gate Out) -->
  <div class="mb-2.5 grid grid-cols-2 gap-3">
    <!-- Gate In Tab -->
    <button
      type="button"
      (click)="selectMode('in')"
      [class.active-gate-tab]="activeMode() === 'in'"
      [class.inactive-gate-tab]="activeMode() !== 'in'"
      class="gate-mode-tab flex cursor-pointer items-center gap-3 rounded-t-xl border-b-[3px] px-3.5 py-2.5 text-left transition-all duration-200">
      <!-- Green Arch Barrier Gate with Right Arrow -->
      <div class="flex h-8 w-8 shrink-0 items-center justify-center">
        <svg
          class="h-7 w-7 text-emerald-600 dark:text-emerald-400"
          viewBox="0 0 28 28"
          fill="none"
          stroke="currentColor"
          stroke-width="2.3"
          stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M6 23V9a4 4 0 0 1 8 0v14" />
          <line x1="4" y1="23" x2="16" y2="23" />
          <path d="M12 16h8m-3-3 3 3-3 3" stroke-width="2.5" />
        </svg>
      </div>

      <div class="flex min-w-0 flex-col">
        <span
          class="text-sm font-bold leading-tight"
          [class.text-[#0f2851]]="activeMode() === 'in'"
          [class.dark:text-white]="activeMode() === 'in'"
          [class.text-slate-600]="activeMode() !== 'in'"
          [class.dark:text-slate-300]="activeMode() !== 'in'">
          Gate In
        </span>
        <span class="mt-0.5 truncate text-xs font-medium leading-normal text-slate-500 dark:text-slate-400">
          {{ gateInCount() }} Trucks
        </span>
      </div>
    </button>

    <!-- Gate Out Tab -->
    <button
      type="button"
      (click)="selectMode('out')"
      [class.active-gate-tab]="activeMode() === 'out'"
      [class.inactive-gate-tab]="activeMode() !== 'out'"
      class="gate-mode-tab flex cursor-pointer items-center gap-3 rounded-t-xl border-b-[3px] px-3.5 py-2.5 text-left transition-all duration-200">
      <!-- Slate Arch Barrier Gate with Orange Left Arrow -->
      <div class="flex h-8 w-8 shrink-0 items-center justify-center">
        <svg
          class="h-7 w-7 text-slate-600 dark:text-slate-400"
          viewBox="0 0 28 28"
          fill="none"
          stroke="currentColor"
          stroke-width="2.3"
          stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M14 23V9a4 4 0 0 1 8 0v14" />
          <line x1="12" y1="23" x2="24" y2="23" />
          <path d="M16 16H8m3-3-3 3 3 3" stroke="#ea580c" stroke-width="2.5" />
        </svg>
      </div>

      <div class="flex min-w-0 flex-col">
        <span
          class="text-sm font-bold leading-tight"
          [class.text-[#0f2851]]="activeMode() === 'out'"
          [class.dark:text-white]="activeMode() === 'out'"
          [class.text-slate-600]="activeMode() !== 'out'"
          [class.dark:text-slate-300]="activeMode() !== 'out'">
          Gate Out
        </span>
        <span class="mt-0.5 truncate text-xs font-medium leading-normal text-slate-500 dark:text-slate-400">
          {{ gateOutCount() }} Trucks
        </span>
      </div>
    </button>
  </div>

  <!-- 3. Live Operational Stages List -->
  <div class="my-0.5 flex min-w-0 flex-1 flex-col justify-between gap-2">
    @for (stage of activeStages(); track stage.id) {
      <div class="grid min-w-0 grid-cols-[auto_minmax(80px,105px)_1fr_auto] items-center gap-3">
        <!-- Stage Circle Icon (Same size as Exceptions & Alerts: h-8 w-8, icon h-4 w-4, stroke-width="2") -->
        <div
          class="shadow-2xs flex h-8 w-8 shrink-0 items-center justify-center rounded-full"
          [class.bg-sky-100]="stage.iconType === 'truck-in'"
          [class.text-sky-600]="stage.iconType === 'truck-in'"
          [class.dark:bg-sky-950\/60]="stage.iconType === 'truck-in'"
          [class.dark:text-sky-400]="stage.iconType === 'truck-in'"
          [class.bg-emerald-100]="stage.iconType === 'ocr-scan' || stage.iconType === 'verification'"
          [class.text-emerald-600]="stage.iconType === 'ocr-scan' || stage.iconType === 'verification'"
          [class.dark:bg-emerald-950\/60]="stage.iconType === 'ocr-scan' || stage.iconType === 'verification'"
          [class.dark:text-emerald-400]="stage.iconType === 'ocr-scan' || stage.iconType === 'verification'"
          [class.bg-amber-100]="stage.iconType === 'gate-in' || stage.iconType === 'gate-out'"
          [class.text-amber-600]="stage.iconType === 'gate-in' || stage.iconType === 'gate-out'"
          [class.dark:bg-amber-950\/60]="stage.iconType === 'gate-in' || stage.iconType === 'gate-out'"
          [class.dark:text-amber-400]="stage.iconType === 'gate-in' || stage.iconType === 'gate-out'">
          @switch (stage.iconType) {
            @case ('truck-in') {
              <!-- Handheld Scanner Terminals / Arrived Icon -->
              <svg
                class="h-4 w-4 fill-none stroke-current"
                stroke-width="2"
                viewBox="0 0 24 24"
                stroke-linecap="round"
                stroke-linejoin="round">
                <rect x="4.75" y="5.5" width="5.5" height="6.5" rx="1.5" />
                <line x1="7.5" y1="12" x2="7.5" y2="15.5" />
                <circle cx="7.5" cy="17" r="1.1" />
                <rect x="13.75" y="7" width="5.5" height="6.5" rx="1.5" />
                <line x1="16.5" y1="13.5" x2="16.5" y2="17" />
                <circle cx="16.5" cy="18.5" r="1.1" />
              </svg>
            }
            @case ('ocr-scan') {
              <!-- OCR Scanner Viewfinder Icon -->
              <svg
                class="h-4 w-4 fill-none stroke-current"
                stroke-width="2"
                viewBox="0 0 24 24"
                stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M5.2 8.5V7a1.8 1.8 0 0 1 1.8-1.8h1.5" />
                <path d="M15.5 5.2H17a1.8 1.8 0 0 1 1.8 1.8v1.5" />
                <path d="M18.8 15.5V17a1.8 1.8 0 0 1-1.8 1.8h-1.5" />
                <path d="M8.5 18.8H7a1.8 1.8 0 0 1-1.8-1.8v-1.5" />
                <circle cx="12" cy="12" r="2.6" />
              </svg>
            }
            @case ('verification') {
              <!-- Verified Shield Icon -->
              <svg
                class="h-4 w-4 fill-none stroke-current"
                stroke-width="2"
                viewBox="0 0 24 24"
                stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M12 19s6.6-3.2 6.6-7.8V6.2l-6.6-2.4L5.4 6.2v5c0 4.6 6.6 7.8 6.6 7.8Z" />
                <path d="m9.2 11.6 1.8 1.8 3.8-3.8" />
              </svg>
            }
            @default {
              <!-- Gate In / Gate Out Double Door Arches -->
              <svg
                class="h-4 w-4 fill-none stroke-current"
                stroke-width="2"
                viewBox="0 0 24 24"
                stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M6 18.5V7a2 2 0 0 1 2-2h2.5a2 2 0 0 1 2 2v11.5" />
                <path d="M12.5 18.5v-6.5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v6.5" />
                <line x1="4.5" y1="18.5" x2="19.5" y2="18.5" />
              </svg>
            }
          }
        </div>

        <!-- Stage Label -->
        <span class="min-w-0 truncate text-sm font-bold text-[#0f2851] dark:text-slate-100">
          {{ stage.label }}
        </span>

        <!-- Progress Bar Track & Gradient Fill -->
        <div class="h-2.5 w-full min-w-0 overflow-hidden rounded-full bg-slate-100 dark:bg-slate-800">
          <div
            class="h-full rounded-full transition-all duration-500"
            [class.stage-progress-blue]="stage.colorTheme === 'blue'"
            [class.stage-progress-amber]="stage.colorTheme === 'amber'"
            [style.width.%]="getStageWidth(stage)"></div>
        </div>

        <!-- Count + Trend Indicator (Strictly inline, bold) -->
        <div class="flex min-w-[70px] shrink-0 items-center justify-end gap-2 whitespace-nowrap text-right">
          <span class="text-sm font-extrabold text-[#0f2851] dark:text-white">
            {{ stage.count }}
          </span>
          <span class="text-xs font-bold text-emerald-600 dark:text-emerald-400"> ↑ {{ stage.trendText }} </span>
        </div>
      </div>
    }
  </div>
</div>
