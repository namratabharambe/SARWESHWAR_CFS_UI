<div class="dashboard-card util-card flex h-full flex-col p-4">
  <div class="mb-2 flex items-center gap-2.5 min-w-0">
    <span class="card-icon">
      <svg viewBox="0 0 24 24"><path d="m12 2 9 5-9 5-9-5 9-5Z" /><path d="m3 12 9 5 9-5" /><path d="m3 17 9 5 9-5" /></svg>
    </span>
    <h3 class="card-title truncate">Yard Utilization by Block</h3>
  </div>

  <!-- Donut: each block is an arc sized by capacity; the solid part is occupied -->
  <div class="donut-wrap">
    <svg viewBox="0 0 100 100" class="donut" role="img"
      [attr.aria-label]="'Yard utilization ' + totalUtilization() + ' percent'">
      @for (s of segments(); track s.name) {
        <circle cx="50" cy="50" r="40" class="arc-track" [style.stroke]="s.color"
          [attr.stroke-dasharray]="s.track" [attr.stroke-dashoffset]="s.offset">
          <title>{{ s.name }}</title>
        </circle>
        <circle cx="50" cy="50" r="40" class="arc-fill" [style.stroke]="s.color"
          [attr.stroke-dasharray]="s.fill" [attr.stroke-dashoffset]="s.offset">
          <title>{{ s.name }}</title>
        </circle>
      }
    </svg>
    <div class="donut-center">
      <span class="donut-pct">{{ totalUtilization() }}<small>%</small></span>
      <span class="donut-label">Utilized</span>
      <span class="donut-sub">{{ currentTeu() | number }} / {{ maxTeu() | number }}</span>
    </div>
  </div>

  <!-- Legend -->
  <div class="mt-auto flex flex-col gap-1.5">
    @for (b of blocks(); track b.name) {
      <div class="legend-row" [title]="b.type">
        <span class="legend-dot" [style.background]="b.color"></span>
        <span class="legend-name truncate">{{ b.name }}</span>
        <span class="legend-val">{{ b.occupied | number }}/{{ b.capacity | number }}</span>
        <span class="legend-pct">{{ b.percentage }}%</span>
      </div>
    }
    <div class="legend-foot">
      <span>{{ availableTeu() | number }} containers available</span>
    </div>
  </div>
</div>
