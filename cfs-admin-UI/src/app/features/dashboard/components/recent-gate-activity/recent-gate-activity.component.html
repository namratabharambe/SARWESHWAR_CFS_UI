<div class="dashboard-card recent-gate-card flex h-full flex-col overflow-hidden">
  <div class="flex items-center justify-between gap-2 px-4 py-3">
    <div class="flex items-center gap-2.5 min-w-0 cursor-pointer" (click)="openLatestPreview()" title="View latest activity">
      <span class="card-icon">
        <svg viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2" /><path d="M17 3h2a2 2 0 0 1 2 2v2" /><path d="M21 17v2a2 2 0 0 1-2 2h-2" /><path d="M7 21H5a2 2 0 0 1-2-2v-2" /><path d="M7 12h10" /></svg>
      </span>
      <h3 class="card-title truncate">Recent Gate Activity</h3>
      <span class="pill live-pill">Live</span>
    </div>
    <a routerLink="/gate-events" class="card-link">View all
      <svg viewBox="0 0 24 24"><path d="M7 17 17 7" /><path d="M7 7h10v10" /></svg>
    </a>
  </div>

  <!-- Auto-scrolling feed (scrollTop driven, so the scrollbar works): pauses on hover/focus. List is rendered twice for a seamless loop. -->
  <div #feed class="feed" (mouseenter)="paused = true" (mouseleave)="resume()" (focusin)="paused = true" (focusout)="resume()">
    <div class="feed-track">
      @for (pass of passes(); track pass) {
        @for (item of latest(); track item.id) {
          <button type="button" class="feed-item" [attr.aria-hidden]="pass ? true : null" [attr.tabindex]="pass ? -1 : null"
            (click)="openPreview(item, $event)">
            <span class="dir-badge" [class.is-out]="item.type === 'OUT'">
              @if (item.type === 'IN') {
                <svg viewBox="0 0 24 24"><path d="M17 7 7 17" /><path d="M17 17H7V7" /></svg>
              } @else {
                <svg viewBox="0 0 24 24"><path d="M7 17 17 7" /><path d="M7 7h10v10" /></svg>
              }
            </span>
            <span class="feed-body">
              <span class="cell-main font-mono tracking-wide">{{ item.containerNo }}</span>
              <span class="cell-sub">
                {{ item.type === 'IN' ? 'Gate In' : 'Gate Out' }}
                @if (item.truckNo && item.truckNo !== 'Pending Scan' && item.truckNo !== 'NA') {
                  · <span class="font-mono">{{ item.truckNo }}</span>
                }
              </span>
            </span>
            <span class="feed-meta">
              <span class="status" [class]="statusTone(item.status)">{{ statusLabel(item.status) }}</span>
              <span class="cell-sub">{{ item.time }} · {{ date(item) }}</span>
            </span>
          </button>
        } @empty {
          <div class="empty-row">No recent gate activity recorded.</div>
        }
      }
    </div>
  </div>

  <div class="table-foot flex items-center justify-between px-4 py-2.5 text-xs">
    <span>Showing {{ latest().length }} of {{ activities().length }} records</span>
    <a routerLink="/gate-events" class="card-link">Open gate events</a>
  </div>
</div>
