<a [routerLink]="metric().route || cardRoute()" class="kpi-card group" [class]="tone()">
  <div class="flex items-start justify-between gap-2">
    <span class="kpi-label truncate">{{ metric().label | translate }}</span>
    <span class="kpi-icon">
      @switch (metric().id) {
        @case ('arrivals-today') {
          <svg viewBox="0 0 24 24"><path d="M17 7 7 17" /><path d="M17 17H7V7" /></svg>
        }
        @case ('departures-today') {
          <svg viewBox="0 0 24 24"><path d="M7 17 17 7" /><path d="M7 7h10v10" /></svg>
        }
        @case ('yard-inventory') {
          <svg viewBox="0 0 24 24">
            <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z" />
            <path d="m3.3 7 8.7 5 8.7-5" /><path d="M12 22V12" />
          </svg>
        }
        @case ('open-tasks') {
          <svg viewBox="0 0 24 24">
            <rect x="3" y="5" width="6" height="6" rx="1" /><path d="m3 17 2 2 4-4" /><path d="M13 6h8" /><path d="M13 12h8" /><path d="M13 18h8" />
          </svg>
        }
        @default {
          <svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" /><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" /></svg>
        }
      }
    </span>
  </div>

  <div class="mt-1.5 flex items-baseline gap-1.5 min-w-0">
    <span class="kpi-value">{{ metric().value }}</span>
    <span class="kpi-unit">{{ unit() }}</span>
  </div>

  <div class="kpi-footer">
    <span class="truncate">{{ caption() }}</span>
    <svg class="kpi-arrow" viewBox="0 0 24 24"><path d="M7 17 17 7" /><path d="M7 7h10v10" /></svg>
  </div>
</a>
