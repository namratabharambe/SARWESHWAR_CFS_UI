<div class="dashboard-card attention-card flex h-full flex-col p-4">
  <div class="mb-2 flex items-center justify-between gap-2">
    <div class="flex items-center gap-2 min-w-0">
      <span class="pulse-dot"></span>
      <h3 class="card-title truncate">Needs Attention</h3>
      <span class="count-badge">{{ openCount() }}</span>
    </div>
    <a routerLink="/alerts" class="card-link">View all
      <svg viewBox="0 0 24 24"><path d="M7 17 17 7" /><path d="M7 7h10v10" /></svg>
    </a>
  </div>

  <div class="flex flex-1 flex-col">
    @for (item of items(); track item.id) {
      <a [routerLink]="item.route" class="attention-row group" [class]="item.tone">
        <span class="row-icon">
          @switch (item.id) {
            @case ('alerts') {
              <svg viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" /><path d="M12 9v4" /><path d="M12 17h.01" /></svg>
            }
            @case ('tasks') {
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" /></svg>
            }
            @case ('ocr') {
              <svg viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2" /><path d="M17 3h2a2 2 0 0 1 2 2v2" /><path d="M21 17v2a2 2 0 0 1-2 2h-2" /><path d="M7 21H5a2 2 0 0 1-2-2v-2" /><path d="M7 12h10" /></svg>
            }
            @default {
              <svg viewBox="0 0 24 24"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z" /><path d="m3.3 7 8.7 5 8.7-5" /><path d="M12 22V12" /></svg>
            }
          }
        </span>
        <span class="flex min-w-0 flex-1 flex-col">
          <span class="row-title truncate">{{ item.title }}</span>
          <span class="row-detail truncate">{{ item.detail }}</span>
        </span>
        <span class="row-count" [class.is-zero]="item.count === 0">{{ item.count }}</span>
        <svg class="row-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></svg>
      </a>
    }
  </div>
</div>
