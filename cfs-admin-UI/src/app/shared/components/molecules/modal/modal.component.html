<div class="modal-backdrop" (click)="onBackdropClick($event)">
  <section
    class="modal-card"
    [class.modal-sm]="size() === 'sm'"
    [class.modal-md]="size() === 'md'"
    [class.modal-lg]="size() === 'lg'"
    [class.modal-xl]="size() === 'xl'"
    [class.modal-2xl]="size() === '2xl'"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="title()"
    (click)="$event.stopPropagation()">
    <!-- Modal Header (Figma Design) -->
    <header class="modal-header">
      <div class="header-content">
        @if (icon()) {
          <div class="modal-icon-badge">
            <span class="icon-char">{{ icon() }}</span>
          </div>
        }
        <div class="modal-title-group">
          <h2 class="modal-title">{{ title() }}</h2>
          @if (subtitle()) {
            <p class="modal-subtitle">{{ subtitle() }}</p>
          }
        </div>
      </div>

      <button type="button" class="modal-close-btn" aria-label="Close dialog" (click)="closed.emit()" title="Close">
        <svg viewBox="0 0 20 20" fill="currentColor" class="close-icon-svg">
          <path
            fill-rule="evenodd"
            d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
            clip-rule="evenodd" />
        </svg>
      </button>
    </header>

    <!-- Modal Body Content -->
    <div class="modal-body">
      <ng-content />
    </div>
  </section>
</div>
